plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.findProperty("mod_version") ?: "1.0.0"
group = project.findProperty("maven_group") ?: "net.fantasy.rift"

base {
    archivesName = project.findProperty("archives_base_name") ?: "riftfantasymod"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    def mcVersion = project.findProperty("minecraft_version") ?: "1.20.1"
    def yarnMappings = project.findProperty("yarn_mappings") ?: "1.20.1+build.10"
    def loaderVer = project.findProperty("loader_version") ?: "0.15.11"
    def fapiVer = project.findProperty("fabric_version") ?: "0.92.2+1.20.1"

    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVer}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fapiVer}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
