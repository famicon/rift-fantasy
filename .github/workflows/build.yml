name: Compile Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Mod with Gradle
        run: gradle build --stacktrace --no-daemon

      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: RiftFantasyMod-Compiled
          path: build/libs/*.jar
